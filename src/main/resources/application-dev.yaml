spring:
  # Local credentials: unversioned file at the project root (see README)
  config:
    import: optional:file:./application-local.yaml

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
