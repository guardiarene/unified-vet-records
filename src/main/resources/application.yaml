spring:
  application:
    name: psygcv

  jpa:
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  time-zone: America/Argentina/Cordoba
  bootstrap:
    admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
      first-name: ${ADMIN_FIRST_NAME:}
      last-name: ${ADMIN_LAST_NAME:}
      phone: ${ADMIN_PHONE:}
