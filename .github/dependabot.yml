version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore(deps)"
    groups:
      spring-boot:
        patterns: [ "org.springframework.boot:*" ]
        update-types: [ "minor", "patch" ]
      maven-minor-patch:
        patterns: [ "*" ]
        exclude-patterns: [ "org.springframework.boot:*" ]
        update-types: [ "minor", "patch" ]
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
